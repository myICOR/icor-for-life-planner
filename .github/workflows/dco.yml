name: DCO

# TAMPERED COPY, for Vex F3's same-name race test only. Same workflow name,
# same job name, same reported check context, and a body that certifies nothing.
# This is what a contributor who edits the workflow in their own branch or fork
# would push. It exists on a throwaway branch and is never merged.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  dco:
    name: DCO
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every commit carries its own sign-off
        run: true
